<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ anime_name }} - AnimeKai Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='player/player.css') }}">
</head>
<body>
    {% include 'nav.html' %}

    <div class="container anime-player-page">
        <div class="anime-player-page-header">
            <a href="/library" class="back-link">← Back to Library</a>
            <h1 class="anime-title">{{ anime_name }}</h1>
        </div>

        <div
            id="anime-player-root"
            class="anime-player-root"
            data-anime-name="{{ anime_name }}">
            <div class="loading">Preparing ultra-fast anime player...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='player/index.js') }}"></script>
</body>
</html>
