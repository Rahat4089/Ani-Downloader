<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ anime_name }} - AnimeKai Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'nav.html' %}
    
    <div class="container">
        <div style="margin-bottom: 20px;">
            <a href="/library" class="back-link">← Back to Library</a>
        </div>
        
        <h1>🎬 {{ anime_name }}</h1>
        <div id="anime-stats" class="subtitle"></div>

        <div class="video-player-card">
            <div class="video-frame video-frame-enhanced">
                <video id="video-player" class="video-player" preload="metadata"></video>

                <div class="video-overlay">
                    <div class="overlay-top">
                        <div id="now-playing" class="now-playing">Select an episode to start watching.</div>
                        <div class="overlay-top-actions">
                            <span id="recording-indicator" class="recording-indicator hidden">⏺ REC 00:00</span>
                            <a id="download-current-btn" class="btn btn-download-current" href="#">⬇️ Download</a>
                        </div>
                    </div>

                    <div class="overlay-bottom">
                        <div class="player-progress-row player-progress-row-overlay">
                            <span id="current-time" class="time-label">00:00</span>
                            <input id="progress-slider" type="range" min="0" max="100" value="0" step="0.1">
                            <span id="duration-time" class="time-label">00:00</span>
                        </div>

                        <div class="player-controls-row player-controls-row-overlay">
                            <div class="player-controls-group">
                                <button id="prev-btn" class="btn btn-player" type="button">⏮</button>
                                <button id="rewind-btn" class="btn btn-player" type="button">⏪ 10s</button>
                                <button id="play-toggle-btn" class="btn btn-player-primary" type="button">▶️ Play</button>
                                <button id="forward-btn" class="btn btn-player" type="button">10s ⏩</button>
                                <button id="next-btn" class="btn btn-player" type="button">⏭</button>
                            </div>

                            <div class="player-controls-group player-controls-right">
                                <button id="mute-btn" class="btn btn-player" type="button">🔊</button>
                                <input id="volume-slider" type="range" min="0" max="1" value="1" step="0.05">
                                <select id="speed-select">
                                    <option value="0.5">0.5x</option>
                                    <option value="0.75">0.75x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="1.25">1.25x</option>
                                    <option value="1.5">1.5x</option>
                                    <option value="2">2x</option>
                                </select>
                                <button id="loop-btn" class="btn btn-player" type="button">🔁</button>
                                <button id="theater-btn" class="btn btn-player" type="button">🖥️</button>
                                <button id="screenshot-btn" class="btn btn-player" type="button">📸</button>
                                <button id="record-btn" class="btn btn-player" type="button">⏺ Rec</button>
                                <button id="pip-btn" class="btn btn-player" type="button">PiP</button>
                                <button id="fullscreen-btn" class="btn btn-player" type="button">⛶</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <p class="player-help">
                Shortcuts: Space play/pause • ←/→ seek • ↑/↓ volume • M mute • F fullscreen • N/P next/prev • L loop • T theater • R record
            </p>
            <div id="player-message" class="player-message"></div>
        </div>

        <div class="danger-zone">
            <button id="delete-series-btn" class="btn btn-danger-action" type="button">🗑 Delete Full Series</button>
        </div>
        
        <div id="episode-list" class="episode-list">
            <div class="loading">Loading episodes...</div>
        </div>
    </div>

    <script>
        const animeName = "{{ anime_name }}";
        let episodes = [];
        let currentEpisodeIndex = -1;
        let pendingRestoreFile = null;
        let controlsHideTimer = null;
        let messageTimer = null;
        let recordingTimer = null;
        let recordingStartTime = 0;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isTheaterMode = false;
        let lastSavedSecond = -1;

        const videoPlayer = document.getElementById('video-player');
        const playerFrame = document.querySelector('.video-frame-enhanced');
        const playerCard = document.querySelector('.video-player-card');
        const progressSlider = document.getElementById('progress-slider');
        const currentTimeLabel = document.getElementById('current-time');
        const durationTimeLabel = document.getElementById('duration-time');
        const playToggleBtn = document.getElementById('play-toggle-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const muteBtn = document.getElementById('mute-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const speedSelect = document.getElementById('speed-select');
        const loopBtn = document.getElementById('loop-btn');
        const theaterBtn = document.getElementById('theater-btn');
        const screenshotBtn = document.getElementById('screenshot-btn');
        const recordBtn = document.getElementById('record-btn');
        const pipBtn = document.getElementById('pip-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const nowPlaying = document.getElementById('now-playing');
        const downloadCurrentBtn = document.getElementById('download-current-btn');
        const recordingIndicator = document.getElementById('recording-indicator');
        const playerMessage = document.getElementById('player-message');
        const deleteSeriesBtn = document.getElementById('delete-series-btn');

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
            const totalSeconds = Math.floor(seconds);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function showMessage(text, isError = false) {
            playerMessage.textContent = text;
            playerMessage.classList.toggle('player-message-error', isError);
            playerMessage.classList.add('player-message-visible');
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => {
                playerMessage.classList.remove('player-message-visible');
            }, 2400);
        }

        function getCurrentEpisode() {
            return episodes[currentEpisodeIndex] || null;
        }

        function getProgressKey(fileName) {
            return `anime-player-progress:${animeName}:${fileName}`;
        }

        function saveCurrentProgress() {
            const episode = getCurrentEpisode();
            if (!episode || !Number.isFinite(videoPlayer.currentTime) || videoPlayer.currentTime < 1) return;
            localStorage.setItem(getProgressKey(episode.name), String(videoPlayer.currentTime));
        }

        function restoreEpisodeProgress(fileName) {
            const raw = localStorage.getItem(getProgressKey(fileName));
            if (!raw) return;
            const seconds = Number(raw);
            if (!Number.isFinite(seconds) || seconds < 1 || !Number.isFinite(videoPlayer.duration)) return;
            if (seconds < videoPlayer.duration - 10) {
                videoPlayer.currentTime = seconds;
                showMessage(`Resumed at ${formatTime(seconds)}`);
            }
        }

        function updatePlayButton() {
            playToggleBtn.textContent = videoPlayer.paused ? '▶️ Play' : '⏸ Pause';
        }

        function updateMuteButton() {
            muteBtn.textContent = videoPlayer.muted || videoPlayer.volume === 0 ? '🔇' : '🔊';
        }

        function updateLoopButton() {
            loopBtn.classList.toggle('btn-player-active', videoPlayer.loop);
        }

        function seekBy(seconds) {
            if (!Number.isFinite(videoPlayer.duration)) return;
            const nextTime = Math.min(videoPlayer.duration, Math.max(0, videoPlayer.currentTime + seconds));
            videoPlayer.currentTime = nextTime;
        }

        function updateEpisodeHighlight() {
            const items = document.querySelectorAll('.episode-item');
            items.forEach((item, index) => {
                item.classList.toggle('episode-item-active', index === currentEpisodeIndex);
            });
        }

        function getStreamUrl(fileName) {
            return `/api/library/stream/${encodeURIComponent(animeName)}/${encodeURIComponent(fileName)}`;
        }

        function getDownloadUrl(fileName) {
            return `/api/library/download/${encodeURIComponent(animeName)}/${encodeURIComponent(fileName)}`;
        }

        function getDeleteEpisodeUrl(fileName) {
            return `/api/library/anime/${encodeURIComponent(animeName)}/file/${encodeURIComponent(fileName)}`;
        }

        function findPlayableIndex(startIndex, step) {
            for (let idx = startIndex; idx >= 0 && idx < episodes.length; idx += step) {
                if (episodes[idx].is_video) return idx;
            }
            return -1;
        }

        function showControls() {
            playerFrame.classList.remove('controls-hidden');
            clearTimeout(controlsHideTimer);
            if (!videoPlayer.paused) {
                controlsHideTimer = setTimeout(() => {
                    playerFrame.classList.add('controls-hidden');
                }, 2600);
            }
        }

        function stopRecordingTimer() {
            clearInterval(recordingTimer);
            recordingTimer = null;
            recordingIndicator.classList.add('hidden');
        }

        function updateRecordingIndicator() {
            const elapsed = Math.max(0, Math.floor((Date.now() - recordingStartTime) / 1000));
            recordingIndicator.textContent = `⏺ REC ${formatTime(elapsed)}`;
        }

        function stopRecording(silent = false) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            stopRecordingTimer();
            recordBtn.classList.remove('btn-player-active');
            recordBtn.textContent = '⏺ Rec';
            if (!silent) showMessage('Recording stopped');
        }

        function getPreferredRecordingMimeType() {
            if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
            const preferred = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm'
            ];
            return preferred.find((item) => MediaRecorder.isTypeSupported(item)) || '';
        }

        async function startRecording() {
            if (!videoPlayer.src || typeof videoPlayer.captureStream !== 'function' || !window.MediaRecorder) {
                showMessage('Recording is not supported in this browser', true);
                return;
            }

            try {
                const stream = videoPlayer.captureStream();
                const mimeType = getPreferredRecordingMimeType();
                const options = mimeType ? { mimeType } : undefined;
                mediaRecorder = new MediaRecorder(stream, options);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (!recordedChunks.length) return;
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const currentName = getCurrentEpisode()?.name || 'recording';
                    const safeBase = currentName.replace(/[^\w.\-]+/g, '_');
                    link.href = url;
                    link.download = `${safeBase}-recording-${Date.now()}.webm`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    URL.revokeObjectURL(url);
                };

                mediaRecorder.start(1000);
                recordingStartTime = Date.now();
                updateRecordingIndicator();
                recordingIndicator.classList.remove('hidden');
                recordingTimer = setInterval(updateRecordingIndicator, 1000);
                recordBtn.classList.add('btn-player-active');
                recordBtn.textContent = '⏹ Stop Rec';
                showMessage('Recording started');
            } catch (error) {
                console.error('Recording start failed:', error);
                showMessage('Failed to start recording', true);
            }
        }

        function toggleTheaterMode() {
            isTheaterMode = !isTheaterMode;
            playerCard.classList.toggle('video-player-theater', isTheaterMode);
            theaterBtn.classList.toggle('btn-player-active', isTheaterMode);
            showMessage(isTheaterMode ? 'Theater mode on' : 'Theater mode off');
        }

        function captureScreenshot() {
            if (!videoPlayer.src || videoPlayer.readyState < 2) {
                showMessage('Play a video before taking screenshot', true);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = videoPlayer.videoWidth;
            canvas.height = videoPlayer.videoHeight;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                showMessage('Screenshot failed', true);
                return;
            }

            ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            const currentName = getCurrentEpisode()?.name || 'frame';
            const safeBase = currentName.replace(/[^\w.\-]+/g, '_');
            link.href = url;
            link.download = `${safeBase}-${Math.floor(videoPlayer.currentTime)}s.png`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            showMessage('Screenshot saved');
        }

        async function togglePlayback() {
            if (!videoPlayer.src) return;
            if (videoPlayer.paused) {
                try {
                    await videoPlayer.play();
                } catch (error) {
                    console.error('Unable to start playback:', error);
                }
            } else {
                videoPlayer.pause();
            }
        }

        async function loadEpisode(index, autoplay = true) {
            const selected = episodes[index];
            if (!selected || !selected.is_video) return;

            saveCurrentProgress();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') stopRecording(true);

            currentEpisodeIndex = index;
            pendingRestoreFile = selected.name;
            videoPlayer.src = getStreamUrl(selected.name);
            downloadCurrentBtn.href = getDownloadUrl(selected.name);
            downloadCurrentBtn.setAttribute('download', selected.name);
            nowPlaying.textContent = `Now playing: ${selected.name}`;
            updateEpisodeHighlight();
            videoPlayer.load();

            if (autoplay) {
                try {
                    await videoPlayer.play();
                } catch (error) {
                    console.debug('Autoplay blocked by browser policy:', error);
                }
            }
        }

        async function deleteEpisode(fileName) {
            const confirmed = confirm(`Delete this episode?\n\n${fileName}`);
            if (!confirmed) return;

            try {
                const response = await fetch(getDeleteEpisodeUrl(fileName), { method: 'DELETE' });
                if (!response.ok) {
                    const payload = await response.json().catch(() => ({}));
                    throw new Error(payload.error || `HTTP ${response.status}`);
                }

                localStorage.removeItem(getProgressKey(fileName));

                if (currentEpisodeIndex >= 0 && episodes[currentEpisodeIndex]?.name === fileName) {
                    videoPlayer.pause();
                    videoPlayer.removeAttribute('src');
                    videoPlayer.load();
                    currentEpisodeIndex = -1;
                    nowPlaying.textContent = 'Episode deleted. Select another episode to watch.';
                }

                await loadAnimeFiles();
                showMessage('Episode deleted');
            } catch (error) {
                alert(`Failed to delete episode: ${error.message}`);
            }
        }

        async function deleteSeries() {
            const confirmed = confirm(`Delete entire series and all episodes?\n\n${animeName}\n\nThis action cannot be undone.`);
            if (!confirmed) return;

            try {
                const response = await fetch(`/api/library/anime/${encodeURIComponent(animeName)}`, { method: 'DELETE' });
                if (!response.ok) {
                    const payload = await response.json().catch(() => ({}));
                    throw new Error(payload.error || `HTTP ${response.status}`);
                }

                window.location.href = '/library';
            } catch (error) {
                alert(`Failed to delete series: ${error.message}`);
            }
        }

        function renderEpisodes() {
            const container = document.getElementById('episode-list');

            if (!episodes.length) {
                container.innerHTML = '<div class="empty-state">No files found</div>';
                return;
            }

            container.innerHTML = episodes.map((file, index) => {
                const sizeLabel = file.size_gb >= 1 ? `${file.size_gb.toFixed(2)} GB` : `${file.size_mb.toFixed(2)} MB`;
                const watchButton = file.is_video
                    ? `<button class="btn btn-watch-inline" type="button" onclick="loadEpisode(${index}, true)">▶️ Watch</button>`
                    : `<button class="btn btn-watch-inline btn-watch-disabled" type="button" disabled title="Not a supported video format">N/A</button>`;

                return `
                    <div class="episode-item">
                        <div class="episode-info">
                            <div class="episode-name">${file.name}</div>
                            <div class="episode-meta">
                                ${sizeLabel} • Modified: ${new Date(file.modified).toLocaleString()} ${file.is_video ? '' : '• Not playable'}
                            </div>
                        </div>
                        <div class="episode-actions">
                            ${watchButton}
                            <a href="${getDownloadUrl(file.name)}"
                               class="btn btn-download"
                               download="${file.name}">
                                ⬇️ Download
                            </a>
                            <button class="btn btn-delete-episode" type="button" data-file="${encodeURIComponent(file.name)}">
                                🗑 Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.btn-delete-episode').forEach((button) => {
                button.addEventListener('click', () => {
                    const decodedName = decodeURIComponent(button.dataset.file);
                    deleteEpisode(decodedName);
                });
            });

            updateEpisodeHighlight();
        }

        async function loadAnimeFiles() {
            try {
                const response = await fetch(`/api/library/anime/${encodeURIComponent(animeName)}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                episodes = data.files || [];
                const playableCount = episodes.filter((file) => file.is_video).length;
                document.getElementById('anime-stats').innerHTML =
                    `${data.total_files} files • ${playableCount} playable • ${data.total_size_mb.toFixed(2)} MB total`;

                renderEpisodes();

                const firstPlayableIndex = episodes.findIndex((file) => file.is_video);
                if (firstPlayableIndex >= 0) {
                    loadEpisode(firstPlayableIndex, false);
                } else {
                    nowPlaying.textContent = 'No playable video files were found in this folder.';
                }
            } catch (error) {
                console.error('Error loading anime files:', error);
                document.getElementById('episode-list').innerHTML =
                    '<div class="error">Failed to load episodes</div>';
            }
        }

        playToggleBtn.addEventListener('click', togglePlayback);
        prevBtn.addEventListener('click', () => {
            if (!episodes.length || currentEpisodeIndex <= 0) return;
            const prevPlayable = findPlayableIndex(currentEpisodeIndex - 1, -1);
            if (prevPlayable >= 0) loadEpisode(prevPlayable, true);
        });
        nextBtn.addEventListener('click', () => {
            if (!episodes.length || currentEpisodeIndex < 0 || currentEpisodeIndex >= episodes.length - 1) return;
            const nextPlayable = findPlayableIndex(currentEpisodeIndex + 1, 1);
            if (nextPlayable >= 0) loadEpisode(nextPlayable, true);
        });
        rewindBtn.addEventListener('click', () => seekBy(-10));
        forwardBtn.addEventListener('click', () => seekBy(10));
        loopBtn.addEventListener('click', () => {
            videoPlayer.loop = !videoPlayer.loop;
            updateLoopButton();
            showMessage(videoPlayer.loop ? 'Loop enabled' : 'Loop disabled');
        });
        theaterBtn.addEventListener('click', toggleTheaterMode);
        screenshotBtn.addEventListener('click', captureScreenshot);
        recordBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        progressSlider.addEventListener('input', () => {
            if (!Number.isFinite(videoPlayer.duration)) return;
            videoPlayer.currentTime = videoPlayer.duration * (Number(progressSlider.value) / 100);
        });

        volumeSlider.addEventListener('input', () => {
            videoPlayer.volume = Number(volumeSlider.value);
            videoPlayer.muted = videoPlayer.volume === 0;
            updateMuteButton();
        });

        muteBtn.addEventListener('click', () => {
            videoPlayer.muted = !videoPlayer.muted;
            if (!videoPlayer.muted && videoPlayer.volume === 0) {
                videoPlayer.volume = 1;
                volumeSlider.value = 1;
            }
            updateMuteButton();
        });

        speedSelect.addEventListener('change', () => {
            videoPlayer.playbackRate = Number(speedSelect.value);
            showMessage(`Speed ${speedSelect.value}x`);
        });

        pipBtn.addEventListener('click', async () => {
            if (!document.pictureInPictureEnabled) return;
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (videoPlayer.src) {
                    await videoPlayer.requestPictureInPicture();
                }
            } catch (error) {
                console.debug('Picture in Picture unavailable:', error);
            }
        });

        fullscreenBtn.addEventListener('click', async () => {
            if (!document.fullscreenElement) {
                await playerFrame.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        });

        videoPlayer.addEventListener('click', togglePlayback);
        videoPlayer.addEventListener('dblclick', async () => {
            if (!document.fullscreenElement) {
                await playerFrame.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        });

        ['mousemove', 'touchstart'].forEach((eventName) => {
            playerFrame.addEventListener(eventName, showControls, { passive: true });
        });
        playerFrame.addEventListener('mouseleave', () => {
            if (!videoPlayer.paused) playerFrame.classList.add('controls-hidden');
        });

        videoPlayer.addEventListener('timeupdate', () => {
            if (!Number.isFinite(videoPlayer.duration) || videoPlayer.duration <= 0) return;
            progressSlider.value = (videoPlayer.currentTime / videoPlayer.duration) * 100;
            currentTimeLabel.textContent = formatTime(videoPlayer.currentTime);

            const rounded = Math.floor(videoPlayer.currentTime);
            if (rounded % 5 === 0 && rounded !== lastSavedSecond) {
                lastSavedSecond = rounded;
                saveCurrentProgress();
            }
        });

        videoPlayer.addEventListener('loadedmetadata', () => {
            durationTimeLabel.textContent = formatTime(videoPlayer.duration);
            currentTimeLabel.textContent = formatTime(videoPlayer.currentTime);
            progressSlider.value = 0;

            if (pendingRestoreFile) {
                restoreEpisodeProgress(pendingRestoreFile);
                pendingRestoreFile = null;
            }
        });

        videoPlayer.addEventListener('play', () => {
            updatePlayButton();
            showControls();
        });
        videoPlayer.addEventListener('pause', () => {
            updatePlayButton();
            clearTimeout(controlsHideTimer);
            playerFrame.classList.remove('controls-hidden');
            saveCurrentProgress();
        });
        videoPlayer.addEventListener('volumechange', updateMuteButton);

        videoPlayer.addEventListener('ended', () => {
            saveCurrentProgress();
            if (videoPlayer.loop) return;
            if (currentEpisodeIndex >= 0 && currentEpisodeIndex < episodes.length - 1) {
                const nextPlayable = findPlayableIndex(currentEpisodeIndex + 1, 1);
                if (nextPlayable >= 0) loadEpisode(nextPlayable, true);
            }
        });

        document.addEventListener('keydown', (event) => {
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

            const key = event.key.toLowerCase();
            if (event.code === 'Space') {
                event.preventDefault();
                playToggleBtn.click();
            } else if (event.code === 'ArrowLeft') {
                event.preventDefault();
                seekBy(-5);
            } else if (event.code === 'ArrowRight') {
                event.preventDefault();
                seekBy(5);
            } else if (event.code === 'ArrowUp') {
                event.preventDefault();
                videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.05);
                volumeSlider.value = videoPlayer.volume;
            } else if (event.code === 'ArrowDown') {
                event.preventDefault();
                videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.05);
                volumeSlider.value = videoPlayer.volume;
            } else if (key === 'm') {
                muteBtn.click();
            } else if (key === 'f') {
                fullscreenBtn.click();
            } else if (key === 'n') {
                nextBtn.click();
            } else if (key === 'p') {
                prevBtn.click();
            } else if (key === 'l') {
                loopBtn.click();
            } else if (key === 't') {
                theaterBtn.click();
            } else if (key === 'r') {
                recordBtn.click();
            } else if (key === 'c') {
                screenshotBtn.click();
            }
        });

        deleteSeriesBtn.addEventListener('click', deleteSeries);
        window.addEventListener('beforeunload', () => {
            saveCurrentProgress();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });

        updateLoopButton();
        updatePlayButton();
        updateMuteButton();
        loadAnimeFiles();
    </script>
</body>
</html>
