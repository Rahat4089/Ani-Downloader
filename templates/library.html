<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - AnimeKai Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'nav.html' %}

    <div class="container">
        <div class="page-header">
            <h1>📚 Library</h1>
            <p class="subtitle">Your anime collection</p>
        </div>

        <div class="server-stats-wrap">
            <h2>🖥️ Server Stats</h2>
            <div id="server-stats-grid" class="server-stats-grid">
                <div class="loading">Loading server stats...</div>
            </div>
        </div>

        <div id="anime-list" class="anime-list">
            <div class="loading">Loading library...</div>
        </div>
    </div>

    <script>
        function formatBytes(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let value = bytes;
            let unitIndex = 0;
            while (value >= 1024 && unitIndex < units.length - 1) {
                value /= 1024;
                unitIndex++;
            }
            return `${value.toFixed(value >= 10 || unitIndex === 0 ? 0 : 2)} ${units[unitIndex]}`;
        }

        function formatUptime(seconds) {
            if (!Number.isFinite(seconds)) return 'N/A';
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${days}d ${hours}h ${minutes}m`;
        }

        async function loadServerStats() {
            try {
                const response = await fetch('/api/library/server-stats');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const stats = await response.json();

                const memory = stats.memory || {};
                const storage = stats.storage || {};
                const load = stats.load_avg || {};

                document.getElementById('server-stats-grid').innerHTML = `
                    <div class="server-metric">
                        <div class="server-metric-label">Series</div>
                        <div class="server-metric-value">${stats.series_count ?? 0}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">Episodes</div>
                        <div class="server-metric-value">${stats.episode_count ?? 0}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">Library Size</div>
                        <div class="server-metric-value">${formatBytes(stats.library_size_bytes)}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">Disk Free / Total</div>
                        <div class="server-metric-value">${formatBytes(storage.free_bytes)} / ${formatBytes(storage.total_bytes)}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">RAM Used / Total</div>
                        <div class="server-metric-value">${formatBytes(memory.used_bytes)} / ${formatBytes(memory.total_bytes)}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">Uptime</div>
                        <div class="server-metric-value">${formatUptime(stats.uptime_seconds)}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">CPU Cores</div>
                        <div class="server-metric-value">${stats.cpu_count ?? 'N/A'}</div>
                    </div>
                    <div class="server-metric">
                        <div class="server-metric-label">Load Avg (1/5/15)</div>
                        <div class="server-metric-value">${load['1m'] ?? '-'} / ${load['5m'] ?? '-'} / ${load['15m'] ?? '-'}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading server stats:', error);
                document.getElementById('server-stats-grid').innerHTML =
                    '<div class="error">Failed to load server stats</div>';
            }
        }

        async function loadLibrary() {
            try {
                const response = await fetch('/api/library/list');
                const library = await response.json();
                
                const container = document.getElementById('anime-list');
                
                if (!library || library.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 No anime downloaded yet</div>';
                    return;
                }
                
                container.innerHTML = library.map(anime => `
                    <a href="/library/${encodeURIComponent(anime.name)}" class="anime-card">
                        <div class="anime-card-header">
                            <h3>${anime.name}</h3>
                        </div>
                        <div class="anime-card-body">
                            <div class="stat">
                                <span class="stat-label">Episodes:</span>
                                <span class="stat-value">${anime.total_files}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Size:</span>
                                <span class="stat-value">${anime.total_size_mb.toFixed(2)} MB</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Error loading library:', error);
                document.getElementById('anime-list').innerHTML = 
                    '<div class="error">Failed to load library</div>';
            }
        }
        
        loadLibrary();
        loadServerStats();
        setInterval(loadLibrary, 30000);
        setInterval(loadServerStats, 30000);
    </script>
</body>
</html>
